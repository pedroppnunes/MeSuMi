name: MeSuMi-Robbery
version: '1.0-26.2'
prefix: 'MeSuMi - Robbery'
description: 'Official MeSuMi - Robbery custom server plugin featuring heist mechanics, skill trees, outposts, and rank progression.'
main: robbery.core.Robbery
api-version: '26.2'
authors: [MeSuMi Team]

softdepend: [PlaceholderAPI,VotingPlugin]
depend: [Vault]
libraries:
  - 'com.zaxxer:HikariCP:5.1.0'

commands:
  acceptalldaily:
    description: Force a player to accept all their daily quests
    usage: /acceptalldaily <player>
    permission: robbery.op
  additem:
    description: Spawns item
    usage: /additem <item_name>
    permission: robbery.op
  adminxp:
    description: Modify a player's Robbery XP or Level
    usage: /adminxp <give|set|reset|setlevel> <player> <amount>
    permission: robbery.adminxp
  baltop:
    description: Shows the top balances
    usage: /baltop [page]
  boosters:
    description: Opens the booster menu
    usage: /boosters
  busted:
    usage: /busted [player]
    permission: robbery.op
  buyback:
    usage: /buyback <back_name> [player]
    permission: robbery.op
  buykey:
    usage: /buykey <key_name> [player]
    permission: robbery.op
  buytool:
    usage: /buytool <back_name> [player]
    permission: robbery.op
  chatcolor:
    usage: /chatcolor
  claim:
    usage: /claim
  ct:
    usage: /ct [player] <color>
    permission: robbery.op
  help:
    description: Shows help command
    usage: /help
  hp:
    usage: /hp
  load:
    usage: /load
    permission: robbery.op
  loadbackup:
    usage: /loadbackup
    permission: robbery.op
  l:
    description: Teleports you to lobby
    usage: /l
  lobby:
    usage: /lobby
  mall:
    usage: /mall
    permission: robbery.mall
  migrate:
    usage: /migrate <subcommand>
    permission: robbery.op
  migrate-to-sql:
    description: Migrate player data from YAML to SQL database
    usage: /migrate-to-sql
    permission: robbery.op
  mute:
    usage: /mute <player> <time> [reason]
    permission: robbery.staff
  muteinfo:
    usage: /muteinfo
  nv:
    usage: /nv
  outpost:
    usage: /outpost
  outpostinfo:
    usage: /outpostinfo
  prestige:
    usage: /prestige
  pv:
    description: Open your private chest
    usage: /pv [slot]
  quests:
    description: Opens quest menu
    usage: /quests <player>
    permission: robbery.op
  ranks:
    usage: /ranks
  rankupdate:
    usage: /rankupdate <rank> [player]
    permission: robbery.op
  rankup:
    usage: /rankup
    aliases: [ru]
  rcrate:
    usage: /rcrate <item> <quantity> <player>
    permission: robbery.op
  removeitem:
    description: Removes an item
    usage: /removeitem
    permission: robbery.op
  robbery:
    description: Main command for Robbery
    usage: /robbery <reload>
    permission: robbery.op
  s:
    description: Teleports you to spawn
    usage: /s
  sellrob:
    usage: /sellrob [player]
    permission: robbery.op
  skillbuy:
    description: Buy a skill tree perk
    usage: /skillbuy <perk> <player>
  skillpointbuy:
    usage: /skillpointbuy <operation> [player]
    permission: robbery.op
  skillpoints:
    description: Opens the skill points menu
    usage: /skillpoints
  resetskilltree:
    description: Reset a player's skilltree and refund spent skillpoints (consumes a reset token)
    usage: /resetskilltree <player>
    permission: robbery.op
  spawn:
    description: Teleports you to spawn
    usage: /spawn
  stopbooster:
    description: Toggles your booster (pause/resume)
    usage: /stopbooster [player]
    permission: robbery.op
  store:
    description: Teleport to your current store
    usage: /store
  toggledoublejump:
    usage: /toggledoublejump
    permission: robbery.rank7
  unmute:
    usage: /unmute <player>
    permission: robbery.staff
  usebooster:
    usage: /usebooster <boostern_n> [player]
    permission: robbery.op
  warn:
    description: Warn a player
    usage: /warn <player> <reason>
    permission: robbery.op
  warnings:
    usage: /warnings
  weeklyleaderboard:
    usage: /weeklyleaderboard
    permission: robbery.op
  crypto:
    description: Open the crypto menu
    usage: /crypto
  backpack:
    description: View your backpack contents
    usage: /backpack
    aliases: [backpacks]
  ho:
    description: Alias for hideout
    usage: /ho
    aliases: [h]

permissions:
  robbery.op:
    description: Allows the user to reload the plugin configuration.
    default: op
  robbery.bypass:
    description: Allows bypassing anything
    default: op
  robbery.rank1:
    description: Burglar
    default: false
  robbery.rank2:
    description: Robber
    default: false
  robbery.rank3:
    description: Bandit
    default: false
  robbery.rank4:
    description: Outlaw
    default: false
    children:
      robbery.mall: true
  robbery.rank5:
    description: Heister
    default: false
    children:
      robbery.mall: true
  robbery.rank6:
    description: Kingpin
    default: false
    children:
      robbery.mall: true
  robbery.rank7:
    description: Mafia Boss
    default: false
    children:
      robbery.mall: true
  robbery.staff:
    default: false
  robbery.noitems:
    default: false

